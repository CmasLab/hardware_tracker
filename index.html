<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking I+D - Control de Dispositivos</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background-color: #f6f8fa; display: flex; justify-content: center; }
        .card { background: white; border: 1px solid #d0d7de; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 600px; }
        h1 { color: #24292f; font-size: 1.5rem; border-bottom: 1px solid #d0d7de; padding-bottom: 10px; margin-top: 0; text-align: center;}
        
        .search-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .search-input { padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 1rem; }
        .input-f { flex: 2; }
        .input-id { flex: 1; min-width: 60px; }
        .search-btn { background-color: #24292f; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background-color: #000000; }

        /* Cuadrícula de metadatos */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .etiqueta { font-size: 0.8rem; color: #57606a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; font-weight: bold;}
        .valor { font-size: 1.05rem; color: #24292f; font-weight: 500; margin-top: 2px; }
        
        /* Secciones de historial */
        .seccion-historial { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #d0d7de; }
        .titulo-historial { font-size: 0.9rem; color: #24292f; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
        .lista-historial { margin: 0; padding-left: 20px; font-size: 0.95rem; color: #24292f; }
        .lista-historial li { margin-bottom: 4px; }
        .sin-registro { font-size: 0.9rem; color: #8c959f; font-style: italic; }

        .error { color: #cf222e; font-weight: bold; text-align: center; margin-top: 20px; }
        .btn { display: block; text-align: center; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-top: 25px; }
        .btn-edit { background-color: #f6f8fa; color: #0969da; border: 1px solid #d0d7de; }
        .btn-add { background-color: #2da44e; color: white; border: 1px solid #2da44e; }
        
        .lista-item { padding: 15px 0; border-bottom: 1px solid #eaecef; display: flex; justify-content: space-between; align-items: center; }
        .lista-item:last-child { border-bottom: none; }
        .btn-sm { background-color: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px; padding: 5px 10px; text-decoration: none; color: #24292f; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tracking de Hardware</h1>
        
        <div class="search-container">
            <input type="text" id="inputF" class="search-input input-f" placeholder="Familia (ej. Gases)">
            <input type="number" id="inputID" class="search-input input-id" placeholder="ID (ej. 1)">
            <button onclick="ejecutarBusqueda()" class="search-btn">Buscar</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        function ejecutarBusqueda() {
            const f = document.getElementById('inputF').value.trim();
            const id = document.getElementById('inputID').value.trim();
            let url = "?";
            if (f) url += "f=" + encodeURIComponent(f);
            if (id) url += (f ? "&" : "") + "id=" + encodeURIComponent(id);
            if (f || id) window.location.href = url;
        }

        document.getElementById('inputF').addEventListener('keypress', e => { if (e.key === 'Enter') ejecutarBusqueda(); });
        document.getElementById('inputID').addEventListener('keypress', e => { if (e.key === 'Enter') ejecutarBusqueda(); });

        const parametros = new URLSearchParams(window.location.search);
        const urlF = parametros.get('f');
        const urlID = parametros.get('id');
        const divResultado = document.getElementById('resultado');

        // REEMPLAZA ESTO POR TU URL REAL DE EDICIÓN
        const urlEdicionJson = "https://github.com/CmasLab/hardware_tracker/blob/Dev/inventario.json";

        // Función auxiliar para renderizar listas de historial de manera limpia
        function generarHtmlLista(lista) {
            if (!lista || lista.length === 0) return '<div class="sin-registro">Sin registros acumulados.</div>';
            let html = '<ul class="lista-historial">';
            lista.forEach(item => { html += `<li>${item}</li>`; });
            html += '</ul>';
            return html;
        }

        if (urlF || urlID) {
            if (urlF) document.getElementById('inputF').value = urlF;
            if (urlID) document.getElementById('inputID').value = urlID;

            fetch('inventario.json')
                .then(response => response.json())
                .then(data => {
                    
                    // CASO A: Búsqueda exacta (Familia + ID) -> Muestra la ficha técnica completa
                    if (urlF && urlID) {
                        const dispositivo = data.find(item => 
                            item.familia && item.familia.toLowerCase() === urlF.toLowerCase() && 
                            item.id === urlID
                        );
                        
                        if (dispositivo) {
                            divResultado.innerHTML = `
                                <div class="meta-grid">
                                    <div>
                                        <div class="etiqueta">Familia y Registro</div>
                                        <div class="valor">${dispositivo.familia} - #${dispositivo.id}</div>
                                    </div>
                                    <div>
                                        <div class="etiqueta">Modelo de Equipo</div>
                                        <div class="valor">${dispositivo.modelo || 'N/A'}</div>
                                    </div>
                                    <div>
                                        <div class="etiqueta">Ubicación Actual</div>
                                        <div class="valor">${dispositivo.ubicacion || 'N/A'}</div>
                                    </div>
                                    <div>
                                        <div class="etiqueta">Estado Operativo</div>
                                        <div class="valor">${dispositivo.estado || 'N/A'}</div>
                                    </div>
                                    <div>
                                        <div class="etiqueta">Responsable Asignado</div>
                                        <div class="valor">${dispositivo.responsable || 'N/A'}</div>
                                    </div>
                                    <div>
                                        <div class="etiqueta">Versión Inicial</div>
                                        <div class="valor">${dispositivo.version || 'N/A'}</div>
                                    </div>
                                </div>

                                <div class="seccion-historial">
                                    <div class="titulo-historial">📜 Historial de Uso</div>
                                    ${generarHtmlLista(dispositivo.historial_uso)}
                                </div>

                                <div class="seccion-historial">
                                    <div class="titulo-historial">🔄 Préstamos y Devoluciones</div>
                                    ${generarHtmlLista(dispositivo.prestamos)}
                                </div>

                                <div class="seccion-historial">
                                    <div class="titulo-historial">🛠️ Cambios de Hardware</div>
                                    ${generarHtmlLista(dispositivo.cambios_hw)}
                                </div>

                                <div class="seccion-historial">
                                    <div class="titulo-historial">💻 Cambios de Firmware</div>
                                    ${generarHtmlLista(dispositivo.cambios_fw)}
                                </div>

                                <div class="seccion-historial">
                                    <div class="titulo-historial">📈 Evolución de Versiones</div>
                                    ${generarHtmlLista(dispositivo.evolucion_versiones)}
                                </div>

                                <a href="${urlEdicionJson}" target="_blank" class="btn btn-edit">✏️ Editar Ficha / Registrar Evento</a>
                            `;
                        } else {
                            // Dispositivo no encontrado -> Generador de plantilla con los nuevos campos vacíos
                            divResultado.innerHTML = `
                                <div class="error">⚠️ No existe el ID #${urlID} en la familia "${urlF}".</div>
                                <p style="text-align: center; color: #57606a; font-size: 0.9rem;">Copia la estructura inferior e incorpórala al final del archivo en GitHub para darlo de alta.</p>
                                
                                <a href="${urlEdicionJson}" target="_blank" class="btn btn-add">➕ Registrar en inventario.json</a>
                                
                                <div style="background-color: #f6f8fa; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 0.75rem; font-family: monospace; color: #57606a; text-align: left; overflow-x: auto;">
                                    ,{<br>
                                    &nbsp;&nbsp;"familia": "${urlF}",<br>
                                    &nbsp;&nbsp;"id": "${urlID}",<br>
                                    &nbsp;&nbsp;"modelo": "Nombre",<br>
                                    &nbsp;&nbsp;"version": "v1.0",<br>
                                    &nbsp;&nbsp;"ubicacion": "Laboratorio",<br>
                                    &nbsp;&nbsp;"estado": "🟢 En Stock",<br>
                                    &nbsp;&nbsp;"responsable": "Nombre",<br>
                                    &nbsp;&nbsp;"historial_uso": [],<br>
                                    &nbsp;&nbsp;"prestamos": [],<br>
                                    &nbsp;&nbsp;"cambios_hw": [],<br>
                                    &nbsp;&nbsp;"cambios_fw": [],<br>
                                    &nbsp;&nbsp;"evolucion_versiones": []<br>
                                    }
                                </div>
                            `;
                        }
                    } 
                    
                    // CASO B: Búsqueda general (Solo Familia) -> Muestra lista resumen
                    else if (urlF && !urlID) {
                        const matchesFamilia = data.filter(item => 
                            item.familia && item.familia.toLowerCase().includes(urlF.toLowerCase())
                        );

                        if (matchesFamilia.length > 0) {
                            let htmlLista = `<div class="etiqueta" style="margin-top:0;">Equipos en Familia: ${urlF}</div>`;
                            matchesFamilia.forEach(disp => {
                                htmlLista += `
                                    <div class="lista-item">
                                        <div>
                                            <div style="font-weight:bold; color:#24292f;">#${disp.id} - ${disp.modelo || 'Sin modelo'}</div>
                                            <div style="font-size:0.85rem; color:#57606a;">📍 ${disp.ubicacion || 'No asignada'} | ${disp.estado || 'N/A'}</div>
                                        </div>
                                        <a href="?f=${encodeURIComponent(disp.familia)}&id=${disp.id}" class="btn-sm">Ver Ficha</a>
                                    </div>
                                `;
                            });
                            divResultado.innerHTML = htmlLista;
                        } else {
                            divResultado.innerHTML = `<div class="error">No se encontraron equipos en la familia "${urlF}".</div>`;
                        }
                    }

                    else if (!urlF && urlID) {
                        divResultado.innerHTML = `<div class="error">Por favor, especifica la Familia además del ID #${urlID} para realizar el cruce.</div>`;
                    }
                })
                .catch(error => {
                    divResultado.innerHTML = `<div class="error">Error leyendo inventario.json. Revisa que la sintaxis de comas y corchetes sea correcta.</div>`;
                });
        } else {
            divResultado.innerHTML = `<div class="etiqueta" style="text-align: center; padding: 20px 0;">Ingresa los parámetros de búsqueda para consultar la base de datos.</div>`;
        }
    </script>
</body>
</html>
