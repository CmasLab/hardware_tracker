<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking I+D - PMV</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background-color: #f6f8fa; display: flex; justify-content: center; }
        .card { background: white; border: 1px solid #d0d7de; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h1 { color: #24292f; font-size: 1.5rem; border-bottom: 1px solid #d0d7de; padding-bottom: 10px; margin-top: 0; text-align: center;}
        
        /* Estilos del buscador */
        .search-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 1rem; }
        .search-btn { background-color: #24292f; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background-color: #000000; }

        .etiqueta { font-size: 0.85rem; color: #57606a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 15px; }
        .valor { font-size: 1.1rem; color: #24292f; font-weight: 500; margin-top: 5px; }
        .error { color: #cf222e; font-weight: bold; text-align: center; margin-top: 20px; }
        .btn { display: block; text-align: center; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-top: 20px; }
        .btn-edit { background-color: #f6f8fa; color: #0969da; border: 1px solid #d0d7de; }
        .btn-add { background-color: #2da44e; color: white; border: 1px solid #2da44e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tracking de Hardware</h1>
        
        <div class="search-container">
            <input type="text" id="inputBusqueda" class="search-input" placeholder="Ingresa ID (ej. 101)">
            <button onclick="buscarId()" class="search-btn">Buscar</button>
        </div>

        <div id="resultado">
            </div>
    </div>

    <script>
        // --- FUNCIÓN DE BÚSQUEDA MANUAL ---
        function buscarId() {
            const idIngresado = document.getElementById('inputBusqueda').value.trim();
            if (idIngresado) {
                // Redirige la página agregando el parámetro a la URL
                window.location.href = "?id=" + idIngresado;
            }
        }

        // Permite presionar "Enter" para buscar sin hacer clic en el botón
        document.getElementById('inputBusqueda').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarId();
            }
        });

        // --- LÓGICA DE LECTURA Y DESPLIEGUE ---
        const parametros = new URLSearchParams(window.location.search);
        const idBuscado = parametros.get('id');
        const divResultado = document.getElementById('resultado');

        // --- ¡ATENCIÓN! CAMBIA ESTO POR TU URL REAL ---
        const urlEdicionJson = "https://github.com/TU_USUARIO/TU_REPOSITORIO/edit/main/inventario.json";

        if (idBuscado) {
            // Coloca el ID buscado en la cajita de texto para que el usuario sepa qué buscó
            document.getElementById('inputBusqueda').value = idBuscado;

            fetch('inventario.json')
                .then(response => response.json())
                .then(data => {
                    const dispositivo = data.find(item => item.id === idBuscado);
                    
                    if (dispositivo) {
                        divResultado.innerHTML = `
                            <div class="etiqueta">ID de Registro</div>
                            <div class="valor">#${dispositivo.id}</div>
                            
                            <div class="etiqueta">Modelo</div>
                            <div class="valor">${dispositivo.modelo}</div>
                            
                            <div class="etiqueta">Versión Hardware</div>
                            <div class="valor">${dispositivo.version}</div>
                            
                            <div class="etiqueta">Estado Actual</div>
                            <div class="valor">${dispositivo.estado}</div>
                            
                            <hr style="margin-top: 25px; border: 0; border-top: 1px solid #d0d7de;">
                            <a href="${urlEdicionJson}" target="_blank" class="btn btn-edit">✏️ Editar estado en GitHub</a>
                        `;
                    } else {
                        divResultado.innerHTML = `
                            <div class="error">⚠️ No se encontró el equipo #${idBuscado}.</div>
                            <p style="text-align: center; color: #57606a; font-size: 0.9rem;">Este ID está disponible. Para registrar el equipo, agrégalo al final del archivo de inventario.</p>
                            
                            <a href="${urlEdicionJson}" target="_blank" class="btn btn-add">➕ Registrar en inventario.json</a>
                            
                            <div style="background-color: #f6f8fa; padding: 10px; margin-top: 15px; border-radius: 6px; font-size: 0.8rem; font-family: monospace; color: #57606a; text-align: left;">
                                Copia y pega esto al final del archivo:<br><br>
                                ,{<br>
                                &nbsp;&nbsp;"id": "${idBuscado}",<br>
                                &nbsp;&nbsp;"modelo": "Nombre",<br>
                                &nbsp;&nbsp;"version": "v1.0",<br>
                                &nbsp;&nbsp;"estado": "🟢 En Stock"<br>
                                }
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    divResultado.innerHTML = `<div class="error">Error de conexión con la base de datos. Asegúrate de que el archivo inventario.json existe.</div>`;
                });
        } else {
            divResultado.innerHTML = `<div class="etiqueta" style="text-align: center; padding: 20px 0;">Escanea un código o ingresa un ID en el buscador superior.</div>`;
        }
    </script>
</body>
</html>
